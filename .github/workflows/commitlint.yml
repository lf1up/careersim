name: Commit messages

on:
  push:
    branches: [main, v2]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tools/commitlint/pnpm-lock.yaml
      - name: Install commitlint
        run: pnpm --dir tools/commitlint install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm --dir tools/commitlint exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Validate squash merge title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm --dir tools/commitlint exec commitlint --verbose
      - name: Validate pushed commits
        if: github.event_name != 'pull_request'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            pnpm --dir tools/commitlint exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          else
            pnpm --dir tools/commitlint exec commitlint --last --verbose
          fi
