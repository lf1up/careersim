name: Security Audit

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2
  schedule:
    # Daily at 03:17 UTC — catches newly disclosed CVEs in unchanged code
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Deprecated services (backend/, frontend/, rag/, transformers/) are
      # intentionally excluded — they are kept for reference only and are no
      # longer part of the runtime. Remove their audit coverage entirely once
      # the directories are deleted.
      matrix:
        include:
          - package: api
            pnpm-version: 10.29.3
          - package: web
            pnpm-version: 10.13.1
          - package: landing
            pnpm-version: 10.13.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails on high/critical vulnerabilities in production dependencies;
      # reads the lockfile, no install needed
      - name: Audit dependencies
        working-directory: ${{ matrix.package }}
        run: pnpm audit --prod --audit-level=high

  pip-audit:
    name: pip-audit (agent)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      # rag/ and transformers/ are intentionally not audited here: their
      # requirements.txt files use unpinned (>=) specifiers, so there is no
      # resolved dependency set to audit. Pin them (or export a lock) first.
      - name: Export locked dependencies
        working-directory: agent
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/agent-requirements.txt

      # ChromaDB FastAPI-server CVEs are risk-accepted: they require the
      # Python HTTP server, which we never run — the agent uses
      # PersistentClient in-process. No patched PyPI release exists yet
      # (1.5.9 is latest). Revisit when a patch lands.
      # - PYSEC-2026-311 / CVE-2026-45829 (ChromaToast pre-auth RCE)
      # - CVE-2026-45833 (post-auth RCE via update_collection)
      # - CVE-2026-45830 (cross-tenant IDOR)
      # - CVE-2026-45831 (RBAC ignores resource context)
      # Pillow parser CVEs are fixed only in 13.0.0. Gradio through 6.30.0
      # (latest) requires pillow<13, and the agent image serves that Gradio
      # app, so Pillow 13 cannot be taken yet. The app does not accept image
      # uploads. Revisit when a Gradio release allows pillow>=13.
      # - CVE-2026-112390 through CVE-2026-112406, CVE-2026-112891 through CVE-2026-112901
      # - CVE-2026-96636 through CVE-2026-96644, CVE-2026-96778, GHSA-78g4-xqwv-q3g8
      # - CVE-2026-112398 (FlashPix JPEG heap overflow), CVE-2026-114501 (Arrow export leak)
      - name: Audit dependencies
        run: |
          uvx pip-audit --requirement /tmp/agent-requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-112390 \
            --ignore-vuln CVE-2026-112391 \
            --ignore-vuln CVE-2026-112392 \
            --ignore-vuln CVE-2026-112393 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112396 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112399 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112401 \
            --ignore-vuln CVE-2026-112402 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112405 \
            --ignore-vuln CVE-2026-112406 \
            --ignore-vuln CVE-2026-112891 \
            --ignore-vuln CVE-2026-112892 \
            --ignore-vuln CVE-2026-112893 \
            --ignore-vuln CVE-2026-112894 \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112899 \
            --ignore-vuln CVE-2026-112900 \
            --ignore-vuln CVE-2026-112901 \
            --ignore-vuln CVE-2026-96636 \
            --ignore-vuln CVE-2026-96637 \
            --ignore-vuln CVE-2026-96638 \
            --ignore-vuln CVE-2026-96639 \
            --ignore-vuln CVE-2026-96640 \
            --ignore-vuln CVE-2026-96641 \
            --ignore-vuln CVE-2026-96642 \
            --ignore-vuln CVE-2026-96643 \
            --ignore-vuln CVE-2026-96644 \
            --ignore-vuln CVE-2026-96778 \
            --ignore-vuln GHSA-78g4-xqwv-q3g8 \
            --ignore-vuln CVE-2026-112398 \
            --ignore-vuln CVE-2026-114501

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
