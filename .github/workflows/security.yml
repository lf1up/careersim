name: Security Audit

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2
  schedule:
    # Daily at 03:17 UTC — catches newly disclosed CVEs in unchanged code
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Deprecated services (backend/, frontend/, rag/, transformers/) are
      # intentionally excluded — they are kept for reference only and are no
      # longer part of the runtime. Remove their audit coverage entirely once
      # the directories are deleted.
      matrix:
        include:
          - package: api
            pnpm-version: 10.29.3
          - package: web
            pnpm-version: 10.13.1
          - package: landing
            pnpm-version: 10.13.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails on high/critical vulnerabilities in production dependencies;
      # reads the lockfile, no install needed
      - name: Audit dependencies
        working-directory: ${{ matrix.package }}
        run: pnpm audit --prod --audit-level=high

  pip-audit:
    name: pip-audit (agent)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      # rag/ and transformers/ are intentionally not audited here: their
      # requirements.txt files use unpinned (>=) specifiers, so there is no
      # resolved dependency set to audit. Pin them (or export a lock) first.
      - name: Export locked dependencies
        working-directory: agent
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/agent-requirements.txt

      # ChromaDB FastAPI-server CVEs are risk-accepted: they require the
      # Python HTTP server, which we never run — the agent uses
      # PersistentClient in-process. No patched PyPI release exists yet
      # (1.5.9 is latest). Revisit when a patch lands.
      # - PYSEC-2026-311 / CVE-2026-45829 (ChromaToast pre-auth RCE)
      # - CVE-2026-45833 (post-auth RCE via update_collection)
      # - CVE-2026-45830 (cross-tenant IDOR)
      # - CVE-2026-45831 (RBAC ignores resource context)
      - name: Audit dependencies
        run: |
          uvx pip-audit --requirement /tmp/agent-requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
